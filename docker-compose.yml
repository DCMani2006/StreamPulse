version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # Redis 7 Message Broker, Streams Queue, and Pub/Sub Backplane
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: streampulse-redis
    command: >
      redis-server
      --save 60 1
      --loglevel notice
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - streampulse-net

  # ---------------------------------------------------------------------------
  # StreamPulse Decoupled FastAPI Gateway (APP_MODE=GATEWAY_ONLY)
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streampulse-gateway
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    ports:
      - "8000:8000"
    environment:
      - APP_MODE=GATEWAY_ONLY
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - STREAM_RAW_VIDEO=stream:video:raw
      - CONSUMER_GROUP_NAME=streampulse_workers
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - streampulse-net

  # ---------------------------------------------------------------------------
  # Scalable ML Analytics Workers (APP_MODE=WORKER, Replicas: 2)
  # ---------------------------------------------------------------------------
  ml-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    deploy:
      replicas: 2
    environment:
      - APP_MODE=WORKER
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - YOLO_MODEL_PATH=yolov8n.pt
      - YOLO_IMAGE_SIZE=320
      - YOLO_DEVICE=cpu
      - STREAM_RAW_VIDEO=stream:video:raw
      - CONSUMER_GROUP_NAME=streampulse_workers
    depends_on:
      redis:
        condition: service_healthy
      api-gateway:
        condition: service_started
    restart: unless-stopped
    networks:
      - streampulse-net

volumes:
  redis_data:
    driver: local

networks:
  streampulse-net:
    driver: bridge
